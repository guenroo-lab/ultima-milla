    html += `<div class="section-card" style="border-left:4px solid var(--red)">
      <h3><span class="step-num" style="background:var(--red)">🔄</span> Reabrir pedido</h3>
      <p style="font-size:12px;color:var(--tx2);margin-bottom:10px">Para cuando el transportista trae de vuelta un pedido ya resuelto (p.ej. una entrega aplazada) y hay que prepararlo otra vez desde cero, visitando sus ubicaciones — como si acabara de importarse.</p>
      <button class="btn-submit" style="background:var(--red)" onclick="conBoton(this, () => confirmarReabrirPedido('${esc(r.ped)}','${esc(r.tienda)}'))">🔄 Reabrir para preparar de nuevo</button>
    </div>`;
  }
  if (r.soportes && r.soportes.length) {
    html += `<div class="section-card"><h3><span class="step-num">📦</span> Soportes</h3>`;
    html += r.soportes.map(s => `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bor);font-size:13px">
      <span style="color:var(--tx)">${esc(s.cant)} × ${esc(s.tipo)}</span>
      <span style="color:var(--tx2);font-size:11px">${esc((Number(s.ocupa||0)*Number(s.cant||0)).toFixed(2))} pos.</span>
    </div>`).join('');
    html += `</div>`;
  } else {
    html += `<div class="section-card"><p style="text-align:center;padding:10px;color:var(--tx2);font-size:12px">Sin soportes registrados para este pedido.</p></div>`;
  }
  if (r.comentario) {
    html += `<div class="section-card" style="border-left:4px solid var(--pur)">
      <h3><span class="step-num" style="background:var(--pur)">💬</span> Comentario</h3>
      <p style="font-size:13px;color:var(--tx);margin-top:6px">${esc(r.comentario)}</p>
    </div>`;
  }
  if (r.carga) {
    const c = r.carga;
    const fmtFecha = iso => { if (!iso) return '—'; try { return new Date(iso).toLocaleString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); } catch (e) { return iso; } };
    const estadoCargaLbl = c.estado === 'CERRADA' ? 'Finalizada' : (c.estado === 'GENERADA' ? 'En curso' : c.estado);
    html += `<div class="section-card" style="border-left:4px solid var(--gold)">
      <h3><span class="step-num" style="background:var(--gold)">🚛</span> Carga ${esc(c.numCarga)} · ${esc(estadoCargaLbl)}</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-top:8px">
        <div style="color:var(--tx2)">Chofer<br><b style="color:var(--tx);font-size:14px">${c.responsable ? esc(c.responsable) : '—'}</b></div>
        <div style="color:var(--tx2)">Quién la cargó<br><b style="color:var(--tx);font-size:14px">${c.cargador ? esc(c.cargador) : '—'}</b></div>
        <div style="color:var(--tx2)">Carga creada<br><b style="color:var(--tx);font-size:13px">${fmtFecha(c.fecha)}</b></div>
        <div style="color:var(--tx2)">Carga finalizada<br><b style="color:var(--tx);font-size:13px">${fmtFecha(c.fechaCierre)}</b></div>
      </div>
    </div>`;
  }
  if (r.historialTransportista && r.historialTransportista.length > 1) {
    const EVENTO_LABEL_HT = { ALTA:'Alta', REIMPORTADO:'Reclasificado', CAMBIO_MANUAL:'Cambio manual', RECOGIDAS:'Recogidas', YA_CARGADOS:'Ya Cargados', REABIERTO:'Volvió (reabierto)', REABIERTO_FORZADO:'Volvió (forzado, líneas nuevas)' };
    html += `<div class="section-card" style="border-left:4px solid var(--pur)">
      <h3><span class="step-num" style="background:var(--pur)">🕓</span> Historial de transportistas (${r.historialTransportista.length})</h3>
      <p style="font-size:11px;color:var(--tx2);margin-bottom:8px">Este pedido ha tenido más de una asignación — se listan todas, no solo la actual.</p>`;
    html += r.historialTransportista.slice().reverse().map(h => {
      let fechaFmt = '—';
      try { fechaFmt = new Date(h.fecha).toLocaleString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); } catch (e) {}
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bor);font-size:12px;flex-wrap:wrap">
        <span style="background:var(--sur3);color:var(--tx2);font-size:10px;padding:2px 7px;border-radius:20px;flex-shrink:0;white-space:nowrap">${esc(EVENTO_LABEL_HT[h.evento]||h.evento||'—')}</span>
        <b style="color:var(--tx)">${esc(h.transportista||'—')}</b>
        <span style="color:var(--tx2);margin-left:auto;font-size:11px;white-space:nowrap">${fechaFmt}</span>
      </div>`;
    }).join('');
    html += `</div>`;
  }
  if (r.lineas && r.lineas.length) {
    html += `<div class="section-card"><h3><span class="step-num">📍</span> Ubicaciones (${r.lineas.length})</h3>`;
    html += r.lineas.map(l => {
      const estadoIco = ({PREPARADO:'✓',NO_SALE:'✗',NO_ENCONTRADO:'✗',POSPUESTO:'↻',PENDIENTE:'○'})[l.estado]||'○';
      const estadoCol = ({PREPARADO:'var(--grn)',NO_SALE:'var(--red)',NO_ENCONTRADO:'var(--red)',POSPUESTO:'var(--pur)',PENDIENTE:'var(--tx3)'})[l.estado]||'var(--tx3)';
      return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bor)">
        <span style="color:${estadoCol};font-size:16px;width:20px;text-align:center">${estadoIco}</span>
        <div style="min-width:60px">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--cyan);letter-spacing:1px">${esc(l.dir)}</div>
          <div style="font-size:9px;color:var(--tx3);text-transform:uppercase">${esc(l.tipoUbic||'')}${l.esPicking?' · picking':''}</div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;color:var(--tx);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l.des||'—')}</div>
          <div style="font-size:10px;color:var(--tx2)">Ref ${esc(l.ref)} · Cant. ${esc(l.ctd)}${l.motivo?' · '+esc(l.motivo):''}</div>
        </div>
      </div>`;
    }).join('');
    html += `</div>`;
  } else {
    html += `<div class="section-card"><p style="color:var(--tx2);font-size:13px;text-align:center;padding:10px">Este pedido no tiene desglose de ubicaciones (ya colocado en silueta).</p></div>`;
  }

  // Panel de GESTIÓN, solo para administración: cambiar tipo de transporte
  // (funciona con el pedido en cualquier estado, incluso ya en silueta) y
  // borrar el pedido (solo si todavía no se ha colocado en ninguna silueta).
  if (MODO_PANEL === 'admin') {
    const flujosSelect = Object.keys(FLUJO_LABELS).map(f => `<option value="${f}"${f===r.flujo?' selected':''}>${esc(FLUJO_LABELS[f])}</option>`).join('');
    html += `<div class="section-card">
      <h3><span class="step-num">🔀</span> Cambiar tipo de transporte</h3>
      <p style="font-size:12px;color:var(--tx2);margin-bottom:10px">Funciona aunque el pedido ya esté en silueta.</p>
      <div style="display:flex;gap:8px">
        <select id="selNuevoFlujo" style="flex:1">${flujosSelect}</select>
        <button class="btn-opc" style="flex:0 0 auto;justify-content:center;padding:11px 16px;background:var(--sur2)" onclick="conBoton(this, () => cambiarFlujoUI('${esc(r.ped)}','${esc(r.tienda)}'))">Cambiar</button>
      </div>
    </div>`;
    html += `<div class="section-card" style="border-color:rgba(227,6,19,.3)">
      <h3 style="color:var(--red)"><span class="step-num" style="background:var(--red)">🗑️</span> Borrar pedido</h3>
      ${r.silueta
        ? `<p style="font-size:12px;color:var(--tx2)">Este pedido ya está en la silueta <b>${esc(r.silueta)}</b>, no se puede borrar directamente. Usa "Devolver a almacenamiento" o "Enviar a tienda" desde la Pantalla de administración.</p>`
        : r.estado !== 'PENDIENTE'
          ? `<p style="font-size:12px;color:var(--tx2)">Un operario ya ha empezado a preparar este pedido (ya tiene ubicaciones marcadas). Solo se puede borrar un pedido que administración acaba de lanzar y que todavía nadie ha tocado.</p>`
          : `<p style="font-size:12px;color:var(--tx2);margin-bottom:10px">Borra el pedido y todas sus líneas por completo. No se puede deshacer.</p>
             <button class="btn-opc" style="justify-content:center;background:var(--red-dim);border-color:rgba(227,6,19,.3);color:var(--red)" onclick="conBoton(this, () => borrarPedidoUI('${esc(r.ped)}','${esc(r.tienda)}'))">🗑️ Borrar pedido ${esc(r.ped)} definitivamente</button>`}
    </div>`;
  }

  cont.innerHTML = html;
}
async function cambiarFlujoUI(numPed, tienda) {
  const nuevoFlujo = document.getElementById('selNuevoFlujo').value;
  let r;
  try { r = await gas('cambiarFlujoPedido', numPed, nuevoFlujo, tienda || null); }
  catch (e) { toast('Error: ' + e.message, 'err'); return; }
  if (!r || !r.ok) { toast('Error: ' + ((r && r.error) || 'no se pudo cambiar'), 'err'); return; }
  toast('✓ Pedido ' + numPed + ' → ' + esc(r.transportista), 'ok');
  ejecutarBusqueda();
}
async function borrarPedidoUI(numPed, tienda) {
  if (!confirm('¿Borrar el pedido ' + numPed + ' definitivamente? Esta acción NO se puede deshacer.')) return;
  let r;
  try { r = await gas('borrarPedidoNoSacado', numPed, tienda || null); }
  catch (e) { toast('Error: ' + e.message, 'err'); return; }
  if (!r || !r.ok) { toast('Error: ' + ((r && r.error) || 'no se pudo borrar'), 'err'); return; }
  toast('✓ Pedido ' + numPed + ' borrado', 'ok');
  document.getElementById('resultadoBusqueda').innerHTML = '';
  document.getElementById('inBuscar').value = '';
}
async function confirmarReabrirPedido(numPed, tienda) {
  if (!confirm('¿Reabrir el pedido ' + numPed + '? Volverá a Pendiente y habrá que prepararlo de nuevo (visitar sus ubicaciones), como si acabara de importarse.')) return;
  let r;
  try { r = await gas('reabrirPedido', numPed, tienda); }
  catch (e) { toast('Error: ' + e.message, 'err'); return; }
  if (!r || !r.ok) { toast('Error: ' + ((r && r.error) || 'no se pudo reabrir'), 'err'); return; }
  toast('✓ Pedido ' + numPed + ' reabierto · ' + r.nLineas + ' ubicaciones', 'ok');
  ejecutarBusqueda();
}

// === DASHBOARD INTERNO ===
async function renderDashboard() {
  const hora = new Date().getHours();
  const modoAuto = hora < (CFG && CFG.horaCambioModo ? CFG.horaCambioModo : 14) ? 'manana' : 'tarde';
  const modo = estado.dashModo || modoAuto;
  let d;
  try { d = await gas('obtenerDatosDashboard'); } catch (e) { toast('Error: ' + e.message, 'err'); return; }
  const pedidos = d.pedidos || [];
  // Estados TERMINALES (mismo set que ESTADOS_TERMINALES en Backend.gs): el
  // pedido ya salió del sistema del todo, sea por la vía que sea — de aquí
  // hacia abajo se usa para no contar como "pendiente de preparar" lo que en
  // realidad ya está resuelto (antes solo se excluía ENTREGADO, así que un
  // pedido "Devuelto a almacén"/"Cerrado · todo faltante" de hace semanas se
  // quedaba contando para siempre en el denominador del progreso global, sin
  // sumar nunca al numerador — el % bajaba con el tiempo aunque en la app ya
  // no quedara casi nada por preparar).
  const TERMINALES_DASH = { ENTREGADO:1, DEVUELTO_ALMACEN:1, ENVIADO_TIENDA:1, SALIDA_MANUAL:1, CERRADO_SIN_SILUETA:1 };
  const cont = e => pedidos.filter(p => p.estado === e).length;
  const r = { total: pedidos.length, completados: cont('COMPLETADO'), enPreparacion: cont('EN_PREPARACION'), pendientes: cont('PENDIENTE') };
  // Derivar estado de carga desde cargaActiva.items (detalle de la carga más
  // reciente aún en curso, para la lista "Extracción en curso").
  let est;
  if (d.cargaActiva) {
    const items = d.cargaActiva.items || [];
    const entregados = items.filter(i => i.estado === 'ENTREGADO').length;
    const noDispo = items.filter(i => i.estado === 'CARGA_2').length;
    est = { activa:true, total:items.length, entregados, noDispo, pct: items.length?Math.round(entregados*100/items.length):0, carga:{ pedidos: items, numCarga: d.cargaActiva.numCarga } };
  } else est = { activa:false, total:0, entregados:0, noDispo:0, pct:0 };

  // Totales del DÍA para los KPIs (En carga/Entregados/Carga 2): incluye
  // también las cargas YA CERRADAS de hoy — confirmarEntregas() cierra la
  // carga en el MISMO instante en que sus pedidos pasan a ENTREGADO/CARGA_2,
  // así que mirar solo cargaActiva (GENERADA) hacía que esos números nunca
  // llegaran a mostrarse.
  const itemsHoy = [];
  (d.cargasHoy || []).forEach(c => itemsHoy.push.apply(itemsHoy, c.items || []));
  const resumenHoy = {
    total: itemsHoy.length,
    entregados: itemsHoy.filter(i => i.estado === 'ENTREGADO').length,
    noDispo: itemsHoy.filter(i => i.estado === 'CARGA_2').length
  };
  // Agrupar ocupación por silueta
  const ocup = {};
  (d.ocupacion || []).forEach(o => { if (!ocup[o.silueta]) ocup[o.silueta] = []; ocup[o.silueta].push(o); });

  // Cargas EN CURSO (cargador ya asignado = se está cargando ahora mismo):
  // cada una con un color distinto, para diferenciarlas en el mapa de siluetas
  // (mismo criterio que la Pantalla TV).
  const cargasActivas = d.cargasActivas || [];
  const colorPorPed = {};
  const cargasEnCurso = cargasActivas.filter(c => c.cargador);
  cargasEnCurso.forEach((c, idx) => {
    const color = PALETA_CARGA[idx % PALETA_CARGA.length];
    (c.items || []).forEach(it => { if (it.estado !== 'ENTREGADO') colorPorPed[String(it.ped)] = color; });
  });
  const cargaLegendHTML = cargasEnCurso.length ? `<div class="dash-card" style="padding:10px 14px">
      <div style="display:flex;flex-wrap:wrap;gap:10px 18px">
        ${cargasEnCurso.map((c, idx) => {
          const color = PALETA_CARGA[idx % PALETA_CARGA.length];
          return `<div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx2)">
            <span style="width:11px;height:11px;border-radius:3px;background:${color};flex-shrink:0"></span>
            Carga <b style="font-family:'Bebas Neue',sans-serif;color:var(--tx);font-size:14px;letter-spacing:.5px">${esc(c.numCarga)}</b> · ${esc(c.cargador)}
          </div>`;
        }).join('')}
      </div>
    </div>` : '';
  // Estilo extra para una celda cuyo pedido está en una carga en curso: color
  // propio de esa carga + pulso, para que se vea "cargándose ahora" en vivo.
  // Devuelve {cls, style} para fusionar con la clase/estilo propios de cada celda
  // (algunas celdas —bultos, zonas libres— ya traen su propio style="...").
  function estiloCarga(pedido) {
    const color = colorPorPed[String(pedido)];
    if (!color) return { cls: '', style: '' };
    return { cls: ' cargando-vivo', style: `border-color:${color};color:${color};background:${color}2b;` };
  }

  // Pedidos que ya rebotaron de una carga anterior (intentoCarga>=2, puesto
  // por confirmarEntregas cada vez que no se escanean): se marcan con una
  // insignia numerada en la esquina de la celda, para distinguirlos a simple
  // vista de los que todavía no se han intentado cargar nunca.
  const intentoPorPed = {};
  pedidos.forEach(p => { if (Number(p.intentoCarga) >= 2) intentoPorPed[String(p.ped)] = Number(p.intentoCarga); });
  function badgeIntento(pedido) {
    const n = intentoPorPed[String(pedido)];
    if (!n) return '';
    return `<span class="badge-intento" title="${n}ª carga">${n}</span>`;
  }

  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:${modo==='manana'?'var(--gold)':'var(--cyan)'}">
        ${modo==='manana'?'🌅 MAÑANA · CARGA':'🌙 TARDE · PREPARACIÓN'}
      </div>
      <div style="display:flex;gap:6px">
        <button onclick="estado.dashModo='manana';renderDashboard()" style="padding:5px 10px;border-radius:8px;border:1px solid ${modo==='manana'?'var(--gold)':'var(--bor)'};background:${modo==='manana'?'rgba(240,180,41,.15)':'var(--sur2)'};color:${modo==='manana'?'var(--gold)':'var(--tx2)'};font-size:11px;font-weight:700;cursor:pointer">🌅 Mañana</button>
        <button onclick="estado.dashModo='tarde';renderDashboard()" style="padding:5px 10px;border-radius:8px;border:1px solid ${modo==='tarde'?'var(--cyan)':'var(--bor)'};background:${modo==='tarde'?'rgba(0,194,255,.1)':'var(--sur2)'};color:${modo==='tarde'?'var(--cyan)':'var(--tx2)'};font-size:11px;font-weight:700;cursor:pointer">🌙 Tarde</button>
        <button onclick="renderDashboard()" style="padding:5px 10px;border-radius:8px;border:1px solid var(--bor);background:var(--sur2);color:var(--tx2);font-size:11px;font-weight:700;cursor:pointer">🔄 Actualizar</button>
      </div>
    </div>`;

  if (modo === 'manana') {
    // "En carga"/"Entregados" siguen viendo solo lo de HOY (cargasHoy); "En
    // silueta sin cargar" y "2ª/3ª carga" en cambio miran TODO lo que sigue
    // en silueta sin entregar, esté o no metido ya en una carga — si solo
    // mirásemos cargasHoy, un pedido que aún no se ha incluido en NINGUNA
    // carga no contaría en ningún sitio (justo lo que confundía: "por cargar:
    // 0" con pedidos todavía visibles en el mapa de siluetas).
    const pedsSegundaCarga = d.pendientesSegundaCargaPeds || [];
    html += `
      <div class="kpi-row" style="grid-template-columns:repeat(2,1fr)">
        <div class="kpi-mini"><div class="v">${resumenHoy.total}</div><div class="l">En carga hoy</div></div>
        <div class="kpi-mini g"><div class="v">${resumenHoy.entregados}</div><div class="l">Entregados hoy</div></div>
        <div class="kpi-mini"><div class="v">${d.enSiluetaSinCargar||0}</div><div class="l">En silueta sin cargar</div></div>
        <div class="kpi-mini r"><div class="v">${d.pendientesSegundaCargaCount||0}</div><div class="l">2ª/3ª carga</div>${pedsSegundaCarga.length?`<div style="font-size:9px;color:var(--tx2);margin-top:3px;word-break:break-all">${pedsSegundaCarga.map(esc).join(', ')}</div>`:''}</div>
      </div>`;
    if (est.activa) {
      html += `<div class="dash-card">
        <h3>Extracción en curso · ${est.pct}%</h3>
        <div class="bar" style="height:8px;margin-bottom:12px"><div style="width:${est.pct}%;height:100%;background:var(--gold)"></div></div>
        ${est.carga.pedidos.map(p => `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bor);font-size:12px">
          <span style="font-size:16px">${p.estado==='ENTREGADO'?'✅':p.estado==='CARGA_2'?'❌':'⏳'}</span>
          <b style="font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.5px;color:var(--tx)">${esc(p.ped)}</b>
          <span class="tienda-chip tienda-${esc(p.tienda)}">${esc(p.tienda)}</span>
          <span style="color:var(--cyan);font-weight:700;margin-left:auto">${esc(p.silueta)}${esc(p.posIni)}${p.posIni!==p.posFin?'–'+esc(p.posFin):''}</span>
        </div>`).join('')}
      </div>`;
    } else {
      html += `<div class="dash-card"><p style="text-align:center;padding:30px;color:var(--tx3);font-style:italic">Sin extracción activa</p></div>`;
    }
  } else {
    const listos = pedidos.filter(p=>p.estado==='COMPLETADO'||p.estado==='COMPLETADO_LISTO'||p.estado==='PARCIAL_LISTO').length;
    html += `
      <div class="kpi-row">
        <div class="kpi-mini g"><div class="v">${listos}</div><div class="l">Listos</div></div>
        <div class="kpi-mini y"><div class="v">${r.enPreparacion}</div><div class="l">En prep.</div></div>
        <div class="kpi-mini"><div class="v">${r.pendientes}</div><div class="l">Pendientes</div></div>
      </div>`;
    const totalPrep = pedidos.filter(p => !TERMINALES_DASH[p.estado]).length;
    const hechos = pedidos.filter(p => p.estado==='COMPLETADO'||p.estado==='COMPLETADO_LISTO'||p.estado==='PARCIAL_LISTO').length;
    const pctGlobal = totalPrep > 0 ? Math.round(hechos*100/totalPrep) : 0;
    html += `<div class="dash-card"><h3>Progreso global · ${pctGlobal}%</h3>
      <div class="bar" style="height:8px;margin-bottom:12px"><div style="width:${pctGlobal}%;height:100%;background:var(--grn)"></div></div>`;
    const flujos = [
      { id:'transporte', nombre:'Transporte', color:'var(--blu)' },
      { id:'instalacion', nombre:'Instalación', color:'var(--ora)' },
      { id:'pro', nombre:'PRO', color:'var(--pur)' },
      { id:'remansur_transporte', nombre:'Remansur', color:'var(--cyan)' },
      { id:'remansur_pro', nombre:'Rem. PRO', color:'var(--pur)' }
    ];
    flujos.forEach(f => {
      const fps = pedidos.filter(p => p.flujo === f.id && !TERMINALES_DASH[p.estado]);
      if (!fps.length) return;
      const fh = fps.filter(p => p.estado==='COMPLETADO'||p.estado==='COMPLETADO_LISTO'||p.estado==='PARCIAL_LISTO').length;
      const fp = fps.length > 0 ? Math.round(fh*100/fps.length) : 0;
      html += `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12px">
        <span style="font-size:10px;font-weight:700;color:${f.color};width:80px;text-transform:uppercase;letter-spacing:.5px">${f.nombre}</span>
        <div style="flex:1;height:6px;background:var(--sur3);border-radius:3px;overflow:hidden"><div style="width:${fp}%;height:100%;background:${f.color}"></div></div>
        <span style="font-size:11px;color:var(--tx2);width:40px;text-align:right">${fh}/${fps.length}</span>
      </div>`;
    });
    html += '</div>';
    // Solo EN_PREPARACION (pct<100 siempre, ver recalcularEstadoPedido): en cuanto
    // un pedido llega al 100% pasa a COMPLETADO_LISTO/PARCIAL_LISTO y desaparece
    // de aquí solo, sin acumular pedidos ya terminados en esta lista.
    const activos = pedidos.filter(p => p.estado === 'EN_PREPARACION').sort((a,b) => (b.pct||0)-(a.pct||0));
    if (activos.length) {
      html += `<div class="dash-card"><h3>En preparación · ${activos.length}</h3>
        <div style="display:flex;flex-wrap:wrap;gap:10px 14px">`;
      activos.forEach(p => {
        const pct = p.pct || 0;
        const col = pct >= 50 ? 'var(--gold)' : 'var(--red)';
        const rad = 19, sw = 4, circ = 2*Math.PI*rad;
        const dash = circ*pct/100;
        html += `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;width:54px" title="${esc(p.ped)} · ${esc(p.tienda)}">
          <div style="position:relative;width:46px;height:46px">
            <svg width="46" height="46">
              <circle cx="23" cy="23" r="${rad}" fill="none" stroke="var(--sur3)" stroke-width="${sw}"/>
              <circle cx="23" cy="23" r="${rad}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${dash} ${circ}" transform="rotate(-90 23 23)"/>
            </svg>
            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:${col}">${pct}%</div>
          </div>
          <span style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.3px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:54px">${esc(p.ped)}</span>
        </div>`;
      });
      html += '</div></div>';
    }
  }

  // Bultos en la UBICACIÓN 0 (ilimitada): se derivan de los pedidos (silueta + posIni 0).
  const bultos0 = {};
  // Bultos MEZCLADOS con un soporte real (palet/jaula) en el MISMO pedido:
  // ese pedido sigue en su posición numerada normal (el palet necesita su
  // hueco físico, no se toca), pero se muestra TAMBIÉN en la zona 0 de su
  // silueta para que se vea que lleva bultos sueltos además del soporte —
  // sin esto, el bulto quedaba invisible, fundido dentro de la posición del
  // palet (empaquetarSoportes/calcularPosiciones lo descartan del cálculo
  // de huecos por diseño, ver Backend.gs calcularPosiciones).
  const bultosMixtos = {};
  const tieneBultoMezclado = p => Array.isArray(p.soportes) && p.soportes.some(x => x.tipoId === 'bulto' && Number(x.cant) > 0);
  pedidos.forEach(p => {
    if (!p.silueta || TERMINALES_DASH[p.estado]) return;
    if (Number(p.posIni) === 0) {
      if (!bultos0[p.silueta]) bultos0[p.silueta] = [];
      bultos0[p.silueta].push(p);
    } else if (tieneBultoMezclado(p)) {
      if (!bultosMixtos[p.silueta]) bultosMixtos[p.silueta] = [];
      bultosMixtos[p.silueta].push(p);
    }
  });

  html += cargaLegendHTML;
  html += `<div class="dash-card"><h3 style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">Siluetas A–G
    <span style="display:flex;gap:6px;flex-wrap:wrap">
      <button onclick="reimprimirCompactado()" style="background:var(--sur3);border:1px solid var(--bor2);color:var(--tx2);padding:6px 12px;border-radius:9px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer">🖨️ Reimprimir compactado</button>
      <button onclick="compactarSiluetasUI()" style="background:var(--sur3);border:1px solid var(--bor2);color:var(--tx2);padding:6px 12px;border-radius:9px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer">🗜️ Compactar siluetas</button>
    </span>
  </h3>`;
  SILUETAS.forEach(s => {
    const ocs = ocup[s] || [];
    const om = {};
    ocs.forEach(o => { if (!om[o.pos]) om[o.pos] = {}; om[o.pos][o.layer] = o; });
    const traseras = new Set(ocs.filter(o => o.layer === 'back' && o.pos > 0).map(o => o.pos)).size;
    const maxPosS = posicionesDeSilueta(s);
    let cellsFront = '', cellsBack = '';
    for (let p = 1; p <= maxPosS; p++) {
      const back = om[p] && om[p].back;
      const front = om[p] && om[p].front;
      const cB = back ? 'tienda-'+back.tienda : '';
      const cF = front ? (front.reservado ? 'reservado-mismo' : 'tienda-'+front.tienda) : '';
      const tB = back ? flujoLetra(back.flujo) : '';
      const tF = front ? (front.reservado ? '·' : flujoLetra(front.flujo)) : '';
      const dataB = back ? `data-ped="${esc(back.pedido)}" data-tienda="${esc(back.tienda)}" data-flujo="${esc(back.flujo)}" data-layer="back" data-pos="${p}" data-sil="${s}"` : '';
      const dataF = front ? `data-ped="${esc(front.pedido)}" data-tienda="${esc(front.tienda)}" data-flujo="${esc(front.flujo)}" data-layer="front" data-pos="${p}" data-sil="${s}"${front.reservado?' data-reservado="1"':''}` : '';
      // Reservado = solo un hueco marcador (mira al back), no resaltar aunque
      // el pedido dueño esté en carga — mismo criterio que la Pantalla TV.
      const eB = back ? estiloCarga(back.pedido) : { cls: '', style: '' };
      const eF = (front && !front.reservado) ? estiloCarga(front.pedido) : { cls: '', style: '' };
      cellsFront += `<div class="pm-cell ${cF} ${cF?'front':''}${eF.cls}" ${dataF}${eF.style?` style="${eF.style}"`:''}><span class="pm-num">${p}</span>${tF}${front && !front.reservado ? badgeIntento(front.pedido) : ''}</div>`;
      cellsBack  += `<div class="pm-cell ${cB}${eB.cls}" ${dataB}${eB.style?` style="${eB.style}"`:''}><span class="pm-num">${p}</span>${tB}${back ? badgeIntento(back.pedido) : ''}</div>`;
    }
    const b0 = bultos0[s] || [];
    const bm = bultosMixtos[s] || [];
    const cells0 = b0.map(p => {
      const e = estiloCarga(p.ped);
      return `<div class="pm-cell tienda-${esc(p.tienda)}${e.cls}" style="width:30px;height:30px;aspect-ratio:auto;flex:0 0 auto;font-size:12px;cursor:pointer;${e.style}" data-ped="${esc(p.ped)}" data-tienda="${esc(p.tienda)}" data-flujo="${esc(p.flujo)}" data-layer="back" data-pos="0" data-sil="${s}">${flujoLetra(p.flujo)}${badgeIntento(p.ped)}</div>`;
    }).join('');
    // Borde discontinuo dorado + data-pos = su posición REAL (no 0): el
    // tooltip (mostrarTooltipCelda) debe seguir mostrando dónde está de
    // verdad el pedido (p.ej. "Silueta A5"), no "A0" -- solo se PRESENTA
    // aquí para avisar de que ese pedido también lleva bultos sueltos.
    const cellsMixtos = bm.map(p => {
      const e = estiloCarga(p.ped);
      return `<div class="pm-cell tienda-${esc(p.tienda)}${e.cls}" style="width:30px;height:30px;aspect-ratio:auto;flex:0 0 auto;font-size:12px;cursor:pointer;border:2px dashed var(--gold);${e.style}" data-ped="${esc(p.ped)}" data-tienda="${esc(p.tienda)}" data-flujo="${esc(p.flujo)}" data-layer="back" data-pos="${esc(p.posIni)}" data-sil="${s}">${flujoLetra(p.flujo)}${badgeIntento(p.ped)}</div>`;
    }).join('');
    const zona0 = (b0.length || bm.length)
      ? `<div style="display:flex;align-items:center;gap:5px;margin-top:5px;background:var(--sur3);border-radius:6px;padding:5px 7px;flex-wrap:wrap">
           <span style="font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--gold);letter-spacing:1px;min-width:50px">0 · 📦</span>${cells0}${bm.length ? `<span style="font-size:10px;color:var(--tx2);margin-left:2px">+ con soporte:</span>${cellsMixtos}` : ''}
         </div>`
      : '';
    html += `<div class="sil-block-d">
      <div class="h"><b>${s}</b><span>${traseras}/${maxPosS} ocupadas${b0.length?` · 📦 ${b0.length} en 0`:''}${bm.length?` · 🔗 ${bm.length} bulto+soporte`:''}</span></div>
      <div class="rows"><div class="row-d" style="grid-template-columns:repeat(${maxPosS},1fr)">${cellsFront}</div><div class="row-d" style="grid-template-columns:repeat(${maxPosS},1fr)">${cellsBack}</div></div>
      ${zona0}
    </div>`;
  });
  html += `</div>`;

  // Zonas libres (nombre a mano, creadas cuando no cabía nada en A-G): se
  // derivan de los propios pedidos, igual que los bultos en ubicación 0.
  const zonasLibres = {};
  pedidos.forEach(p => {
    if (p.silueta && SILUETAS.indexOf(p.silueta) === -1 && !TERMINALES_DASH[p.estado]) {
      if (!zonasLibres[p.silueta]) zonasLibres[p.silueta] = [];
      zonasLibres[p.silueta].push(p);
    }
  });
  const nombresZonas = Object.keys(zonasLibres);
  if (nombresZonas.length) {
    html += `<div class="dash-card"><h3>📍 Otras zonas (sin sitio en A–G)</h3>`;
    nombresZonas.forEach(nombre => {
      const lista = zonasLibres[nombre].slice().sort((a,b) => (Number(a.posIni)||0)-(Number(b.posIni)||0));
      html += `<div class="sil-block-d">
        <div class="h"><b style="font-size:15px">${esc(nombre)}</b><span>${lista.length} pedido${lista.length!==1?'s':''}</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
          ${lista.map(p => {
            // Bulto (posición 0, ilimitada): mismo indicador 📦 que en las siluetas A-G, no "· 0".
            const pos = Number(p.posIni) === 0 ? '📦 bulto' : (p.posIni === p.posFin ? p.posIni : `${p.posIni}–${p.posFin}`);
            const e = estiloCarga(p.ped);
            return `<div class="pm-cell tienda-${esc(p.tienda)}${e.cls}" style="width:auto;aspect-ratio:auto;flex:0 0 auto;padding:6px 10px;font-size:12px;cursor:pointer;${e.style}" data-ped="${esc(p.ped)}" data-tienda="${esc(p.tienda)}" data-flujo="${esc(p.flujo)}" data-layer="back" data-pos="${esc(p.posIni)}" data-sil="${esc(nombre)}">${esc(p.ped)} · ${esc(pos)}${badgeIntento(p.ped)}</div>`;
          }).join('')}
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  app().innerHTML = html;
}

// === COMPACTAR SILUETAS: recolocar todo lo que está en A-G hacia las
// primeras posiciones libres desde la A, y generar un croquis imprimible
// para que el operario reordene físicamente igual que ha quedado en el
// sistema. Previsualiza primero (sin tocar nada) y solo aplica tras
// confirmar — el mismo plan que se ve es el que se ejecuta. ===
let COMPACTAR_PLAN = null;
async function compactarSiluetasUI() {
  let prev;
  try { prev = await gas('previsualizarCompactarSiluetas'); }
  catch (e) { toast('Error: ' + e.message, 'err'); return; }
  const movs = prev.movimientos || [];
  if (!movs.length) { toast('Ya está todo compactado, no hay pedidos que mover.', 'ok'); return; }
  COMPACTAR_PLAN = movs;

  const filas = movs.map(m => `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bor);font-size:12px">
    <b style="font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.5px">${esc(m.ped)}</b>
    <span class="tienda-chip tienda-${esc(m.tienda)}">${esc(m.tienda)}</span>
    <span style="color:var(--tx2);margin-left:auto">${esc(m.siluetaVieja)}${esc(m.posIniVieja)}</span>
    <span style="color:var(--tx3)">→</span>
    <span style="color:var(--cyan);font-weight:700">${esc(m.siluetaNueva)}${esc(m.posIniNueva)}</span>
  </div>`).join('');

  const viejo = document.getElementById('modalCompactar'); if (viejo) viejo.remove();
  const html = `<div class="modal-overlay" id="modalCompactar" onclick="if(event.target===this)document.getElementById('modalCompactar').remove()">
    <div class="modal" style="max-width:480px">
      <h2>🗜️ Compactar siluetas</h2>
      <p style="font-size:12px;color:var(--tx2);margin-bottom:12px">Se reubicarán <b>${movs.length}</b> pedido${movs.length!==1?'s':''} hacia las primeras posiciones libres desde la silueta A (incluidas las zonas libres) y se consolidarán los bultos sueltos en la zona de bultos de A. No se toca Recogidas/Ya Cargados. Después se genera un croquis para reordenarlos físicamente.</p>
      <div style="max-height:280px;overflow-y:auto;margin-bottom:14px">${filas}</div>
      <button class="btn-submit" onclick="conBoton(this, () => confirmarCompactarSiluetas())">✅ Confirmar y generar croquis</button>
      <button class="modal-cancel" onclick="document.getElementById('modalCompactar').remove()">Cancelar</button>
    </div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}
function confirmarCompactarSiluetas() {
  const movs = COMPACTAR_PLAN;
  const modal = document.getElementById('modalCompactar'); if (modal) modal.remove();
  if (!movs || !movs.length) return;
  // Abrir la ventana SÍNCRONO, dentro de ESTE clic directo (no después de un await).
  const w = window.open('', '_blank', 'width=950,height=750');
  if (w) { try { w.document.write('Aplicando y generando croquis…'); } catch (e) {} }
  gas('aplicarCompactarSiluetas', movs).then(function(r) {
    let msg = `✓ ${r.aplicados} pedido${r.aplicados!==1?'s':''} reubicados`;
    if (r.omitidos && r.omitidos.length) msg += ` · ${r.omitidos.length} omitidos: ${r.omitidos.join(', ')}`;
    toast(msg, 'ok');
    if (estado.tab === 'dash') renderDashboard();
    return gas('htmlCroquisReorganizacion', r.movimientos);
  }).then(function(html) {
    if (w) {
      try {
        w.document.open(); w.document.write(html); w.document.close(); w.focus();
        setTimeout(function() { try { w.print(); } catch (e) {} }, 500);
        return;
      } catch (e) { /* plan B si la ventana fue bloqueada */ }
    }
    imprimirEnMarcoOculto(html);
  }).catch(function(e) {
    toast('Error: ' + e.message, 'err');
    // Si la ventana quedó abierta con el mensaje "Aplicando y generando
    // croquis…" y esto falla (incluida la espera de 20s de gas()), no la
    // dejamos colgada sin explicación — se sustituye por el error real.
    if (w) { try { w.document.open(); w.document.write('<p style="font-family:sans-serif;padding:20px">Error: ' + esc(e.message || String(e)) + '</p>'); w.document.close(); } catch (e2) {} }
  });
}
// Reimprime el estado ACTUAL de las siluetas (no depende de que se acabe de
// compactar nada — funciona siempre, aunque ya esté todo compacto). Mismo
// patrón de ventana síncrona + marco oculto de respaldo que
// confirmarCompactarSiluetas.
function reimprimirCompactado() {
  const w = window.open('', '_blank', 'width=950,height=750');
  if (w) { try { w.document.write('Generando croquis…'); } catch (e) {} }
  gas('htmlCroquisSiluetaActual').then(function(html) {
    if (w) {
      try {
        w.document.open(); w.document.write(html); w.document.close(); w.focus();
        setTimeout(function() { try { w.print(); } catch (e) {} }, 500);
        return;
      } catch (e) { /* plan B si la ventana fue bloqueada */ }
    }
    imprimirEnMarcoOculto(html);
  }).catch(function(e) {
    toast('Error: ' + e.message, 'err');
    if (w) { try { w.document.open(); w.document.write('<p style="font-family:sans-serif;padding:20px">Error: ' + esc(e.message || String(e)) + '</p>'); w.document.close(); } catch (e2) {} }
  });
}
// === RETIRADAS DE PEDIDO (Store Delivery) ===
// Genera y descarga un .bat con un script de PowerShell embebido (vía
// -EncodedCommand, evita problemas de política de ejecución de Windows sin
// tener que cambiar ningún ajuste del sistema) que hace las llamadas reales
// a la API de Leroy Merlin DESDE EL PC del usuario al ejecutarlo — nada de
// esto pasa por el servidor de Apps Script. Necesario porque Leroy Merlin
// bloquea las llamadas que salen de plataformas de nube (Apps Script,
// Cloudflare Workers, probado en ambas), pero no las de un PC normal.
// Mapa duplicado a propósito de CONFIG.CODIGO_TIENDA (Configuracion.gs) —
// si se añade una tienda nueva allí, replicar aquí también.
const CODIGO_TIENDA_RETIRADAS = { 'Málaga': '036', 'Marbella': '014', 'Granada': '043', 'Mijas': '279' };

function _psEscape(s) {
  return String(s).replace(/'/g, "''");
}

function descargarProgramaRetiradas() {
  // Segunda barrera además del checkbox deshabilitado en renderStoreDelivery
  // (por si acaso, p.ej. un pedido añadido a mano sin datos de parcialReal):
  // un pedido de verdad parcial NUNCA se procesa como retirada completa.
  const parciales = SD_PEDIDOS.filter(p => p.tipoEntrega === 'delivery' && p.parcialReal);
  const pedidosDelivery = SD_PEDIDOS.filter(p => p.tipoEntrega === 'delivery' && !p.parcialReal);
  if (parciales.length) {
    toast('⚠ ' + parciales.length + ' pedido(s) parcial(es) excluido(s) de la retirada: ' + parciales.map(p => p.ped).join(', '), 'err');
  }
  if (!pedidosDelivery.length) { toast('Marca al menos un pedido como Delivery', 'err'); return; }
  const tienda = document.getElementById('sdTienda').value;
  const codTienda = CODIGO_TIENDA_RETIRADAS[tienda] || '';
  if (!codTienda) { toast('Tienda sin código conocido: ' + tienda, 'err'); return; }
  const numeros = pedidosDelivery.map(p => p.ped);

  const listaPS = numeros.map(n => "'" + _psEscape(n) + "'").join(', ');
  const script = `$tiendaNombre = '${_psEscape(tienda)}'
$codTienda = '${_psEscape(codTienda)}'
$pedidos = @(${listaPS})
$ok = 0; $revisar = 0; $errores = 0
Write-Host "=== Retiradas $tiendaNombre ===" -ForegroundColor Cyan
Write-Host ""
foreach ($pedido in $pedidos) {
  $resultado = 'ERROR DE CONEXION'
  $cliente = ''
  try {
    $chk = Invoke-RestMethod -Uri "https://store-delivery-api-pro.sales-pro-eslm.tech.adeo.cloud/v1/commands/check/$codTienda/$pedido" -Method Get
    if ($chk.code -eq 0 -and $chk.command) {
      $cliente = ("$($chk.command.customer.firstName) $($chk.command.customer.lastName)").Trim()
      try {
        $bodyJson = $chk.command | ConvertTo-Json -Depth 20 -Compress
        $conf = Invoke-RestMethod -Uri "https://store-delivery-api-pro.sales-pro-eslm.tech.adeo.cloud/v1/commands/check" -Method Post -ContentType 'application/json' -Body $bodyJson
        $resultado = if ($conf.code -eq 0) { 'OK' } else { 'ERROR AL CONFIRMAR' }
      } catch {
        $resultado = 'ERROR AL CONFIRMAR'
      }
    } else {
      $resultado = 'REVISAR EN MOSTRADOR'
    }
  } catch {
    $resultado = 'ERROR DE CONEXION'
  }
  if ($resultado -eq 'OK') { $ok++; $color = 'Green' }
  elseif ($resultado -eq 'REVISAR EN MOSTRADOR') { $revisar++; $color = 'Yellow' }
  else { $errores++; $color = 'Red' }
  $linea = "$pedido -> $resultado"
  if ($cliente) { $linea += " ($cliente)" }
  Write-Host $linea -ForegroundColor $color
}
Write-Host ""
Write-Host "Total: $($pedidos.Count) | OK: $ok | Revisar: $revisar | Error: $errores" -ForegroundColor Cyan
Write-Host ""
Write-Host "Puedes cerrar esta ventana."
`;

  // Codificar como UTF-16LE + Base64 — formato exacto que espera
  // -EncodedCommand de PowerShell (probado y confirmado que funciona).
  const buf = new ArrayBuffer(script.length * 2);
  const view = new DataView(buf);
  for (let i = 0; i < script.length; i++) view.setUint16(i * 2, script.charCodeAt(i), true);
  const bytes = new Uint8Array(buf);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  const encoded = btoa(binary);

  const batContent = '@echo off\r\npowershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand ' + encoded + '\r\npause\r\n';
  const blob = new Blob([batContent], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const fecha = new Date().toISOString().slice(0, 10);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'retiradas_' + tienda.replace(/[^a-zA-Z0-9]/g, '') + '_' + fecha + '.bat';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Programa descargado — ábrelo con doble clic para procesar los pedidos', 'ok');
}

// Redimensiona UNA foto en un <canvas> (lado mayor ~1280px, calidad ~0.7)
// antes de mandarla — una foto de móvil sin comprimir (3-8 MB) puede
// reventar el payload o el watchdog de 20s de gas().
function redimensionarFoto(file) {
  return new Promise(function(resolve, reject) {
    const lector = new FileReader();
    lector.onerror = function() { reject(new Error('No se pudo leer la foto')); };
    lector.onload = function() {
      const img = new Image();
      img.onerror = function() { reject(new Error('No se pudo procesar la foto')); };
      img.onload = function() {
        const maxLado = 1280;
        let w = img.width, h = img.height;
        if (w > maxLado || h > maxLado) {
          if (w > h) { h = Math.round(h * maxLado / w); w = maxLado; }
          else { w = Math.round(w * maxLado / h); h = maxLado; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        resolve({ base64: dataUrl.split(',')[1], mime: 'image/jpeg' });
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(file);
  });
}
// Lee hasta 4 fotos de un <input type="file" multiple> ya redimensionadas,
// lista para mandar a gas(). Una foto que falle se omite (con aviso) en vez
// de bloquear el resto.
async function capturarFotosRedimensionadas(inputEl) {
  const archivos = Array.prototype.slice.call((inputEl && inputEl.files) || []).slice(0, 4);
  const fotos = [];
  for (let i = 0; i < archivos.length; i++) {
    try { fotos.push(await redimensionarFoto(archivos[i])); }
    catch (e) { toast('Una foto no se pudo procesar y se ha omitido', 'err'); }
  }
  return fotos;
}

function pantallaIncidencias() {
  if (MODO_PANEL === 'admin') pantallaIncidenciasAdmin();
  else pantallaIncidenciasOperario();
}

// Lista de tarjetas compartida entre admin/operario/histórico.
function renderListaIncidencias(contId, lista) {
  const cont = document.getElementById(contId);
  if (!cont) return;
  if (!lista.length) { cont.innerHTML = '<div class="empty-state"><div class="icon">🚨</div>No hay incidencias.</div>'; return; }
  cont.innerHTML = lista.map(inc => {
    const tipoLabel = (TIPOS_INCIDENCIA.find(t => t.id === inc.tipo) || {}).label || inc.tipo;
    return `<div class="section-card" style="padding:12px 14px;margin-bottom:8px;cursor:pointer" onclick="pantallaDetalleIncidencia('${esc(inc.id)}')">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <b style="font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px">${esc(inc.ped)}</b>
        <span style="font-size:11px;font-weight:700;color:${ESTADOS_INCIDENCIA_COLOR[inc.estado] || 'var(--tx2)'}">${esc(ESTADOS_INCIDENCIA_LABEL[inc.estado] || inc.estado)}</span>
      </div>
      <div style="font-size:12px;color:var(--tx2);margin-top:4px">${esc(tipoLabel)} · ${esc(inc.tienda)}${inc.prioridad === 'URGENTE' ? ' · <span style="color:var(--red);font-weight:700">🔴 URGENTE</span>' : ''}</div>
      <div style="font-size:11px;color:var(--tx3);margin-top:4px">${inc.asignado ? '👤 ' + esc(inc.asignado) : '🔓 Sin asignar'}</div>
    </div>`;
  }).join('');
}
